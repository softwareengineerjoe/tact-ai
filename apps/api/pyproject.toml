[project]
name = "tact-api"
version = "0.1.0"
description = "TACT AI backend — FastAPI service"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.140.*",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]
# Alembic migration scripts are generated-style; don't lint their long lines.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
# B008: FastAPI intentionally uses `Depends(...)` in argument defaults.
# UP046: BACKEND_STANDARDS §6 uses `Generic[T]` for the shared Page envelope.
ignore = ["B008", "UP046"]

[tool.ruff.lint.per-file-ignores]
# Seed data uses wide literal tuples for readability.
"app/seed.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
