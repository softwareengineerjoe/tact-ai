services:
  db:
    image: postgres:17
    container_name: tact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tact_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-tact}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tact-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tact} -d ${POSTGRES_DB:-tact}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tact-postgres-data:
