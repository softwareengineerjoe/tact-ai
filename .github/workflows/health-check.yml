name: Health Check

# Automated uptime/health monitoring for the deployed TACT AI environment.
# Runs every 12 hours (and on demand) to confirm the backend API and web SPA
# are reachable and healthy. Fails the run — surfacing a GitHub notification —
# when any endpoint is unhealthy.

on:
  schedule:
    # 00:00 and 12:00 UTC every day (every 12 hours).
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}

# Allow overriding the targets without editing the file.
env:
  API_BASE_URL: ${{ vars.HEALTH_API_BASE_URL || 'https://tactai-api.kindmoss-f3208b8d.southeastasia.azurecontainerapps.io' }}
  WEB_BASE_URL: ${{ vars.HEALTH_WEB_BASE_URL || 'https://delightful-bush-09d54d900.3.azurestaticapps.net' }}

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  health-check:
    name: Probe deployed endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Backend liveness (/health/live)
        run: |
          url="${API_BASE_URL%/}/health/live"
          echo "Probing $url"
          body=$(curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 "$url")
          echo "Response: $body"
          echo "$body" | grep -q '"status":"ok"' \
            || { echo "::error::Backend liveness check failed"; exit 1; }

      - name: Backend readiness (/health/ready)
        run: |
          url="${API_BASE_URL%/}/health/ready"
          echo "Probing $url"
          body=$(curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 "$url")
          echo "Response: $body"
          echo "$body" | grep -q '"status":"ready"' \
            || { echo "::error::Backend readiness check failed"; exit 1; }

      - name: Web SPA reachability
        run: |
          url="${WEB_BASE_URL%/}/"
          echo "Probing $url"
          code=$(curl --show-error --silent --location \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")
          echo "HTTP status: $code"
          [ "$code" = "200" ] \
            || { echo "::error::Web SPA returned HTTP $code"; exit 1; }

      - name: Summary
        if: always()
        run: |
          {
            echo "### TACT AI health check"
            echo ""
            echo "- API: \`$API_BASE_URL\`"
            echo "- Web: \`$WEB_BASE_URL\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
